<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>나 키우기</title>
<meta name="description" content="내 상태로 능력치를 정하고 매일의 기록으로 나를 키우는 앱">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="나 키우기">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#E8EEEB" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1517" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.5 system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<style id="app-css">
/* Layout: one-column phone app — character card on top, four tabs in a fixed bottom bar. */
:root{
  --bg:#E8EEEB; --surface:#F7FAF8; --sunk:#DDE6E2; --ink:#16232A; --muted:#58696E; --line:#C6D3CE;
  --accent:#1E8752; --accent-ink:#FFFFFF; --bad:#BF4337;
  --c-body:#D2522F; --c-intel:#2F62C4; --c-mind:#8150C2; --c-social:#B9840A; --c-life:#178069;
  --f-display:"Do Hyeon","IBM Plex Sans KR",system-ui,sans-serif;
  --f-body:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1517; --surface:#172124; --sunk:#111A1C; --ink:#E2EBE7; --muted:#8EA1A1; --line:#2A3A3D;
  --accent:#49C285; --accent-ink:#0B1A12; --bad:#E7756A;
  --c-body:#F07B57; --c-intel:#6C9BF2; --c-mind:#B48CF0; --c-social:#E8B53A; --c-life:#43C2A2; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1517; --surface:#172124; --sunk:#111A1C; --ink:#E2EBE7; --muted:#8EA1A1; --line:#2A3A3D;
  --accent:#49C285; --accent-ink:#0B1A12; --bad:#E7756A;
  --c-body:#F07B57; --c-intel:#6C9BF2; --c-mind:#B48CF0; --c-social:#E8B53A; --c-life:#43C2A2; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:16px calc(84px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;margin:0;text-wrap:balance;letter-spacing:.01em}
h2{font-size:22px} h3{font-size:18px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
button:not(:disabled):active{filter:brightness(.92)}
.brk{display:grid;grid-template-columns:1.2fr 1fr 1fr 1fr;gap:8px;align-items:baseline;padding:4px 0;border-bottom:1px solid var(--line)}
.brk:last-child{border-bottom:none}
.brk>span:not(:first-child){text-align:right}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Character card */
.hero{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:grid;grid-template-columns:76px 1fr;gap:14px;align-items:center}
.avatar{width:76px;height:76px;border-radius:14px;background:var(--sunk);display:grid;place-items:center}
.hero h1{font-size:28px;line-height:1.1}
.hero .meta{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:4px;font-size:13px;color:var(--muted)}
.badge{display:inline-block;font-family:var(--f-display);font-size:14px;padding:1px 8px;border-radius:999px;background:var(--accent);color:var(--accent-ink)}
.mini{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;grid-column:1/-1}
.mini div{background:var(--sunk);border-radius:10px;padding:6px 4px;text-align:center}
.mini b{display:block;font-family:var(--f-num);font-size:17px}
.mini span{font-size:11px;color:var(--muted)}

/* Panels */
.panel{display:flex;flex-direction:column;gap:12px}
.sec-label{font-size:12px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase;font-weight:600}
.daybar{display:flex;align-items:center;justify-content:space-between;gap:8px}
.daybar button{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:18px}
.daybar button:disabled{opacity:.35;cursor:default}
.daybar .d{text-align:center}
.daybar .d b{font-family:var(--f-display);font-size:22px;font-weight:400;display:block}
.delta{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.delta>div{border:1px solid var(--line);border-radius:10px;padding:6px 2px;text-align:center;background:var(--surface)}
.delta .v{font-family:var(--f-num);font-size:16px;font-weight:600}
.delta .n{font-size:11px;color:var(--muted)}
.pos{color:var(--accent)} .neg{color:var(--bad)} .zero{color:var(--muted)}

.acts{display:flex;flex-direction:column;gap:8px}
.act{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start;text-align:left;width:100%;
  background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.act .box{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:15px;color:transparent}
.act.on{border-color:var(--accent)}
.act.on .box{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.act.bad.on{border-color:var(--bad)}
.act.bad.on .box{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.act .t{font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.chip{font-size:12px;padding:1px 7px;border-radius:999px;border:1px solid currentColor;font-family:var(--f-body)}
.chip b{font-family:var(--f-num);font-weight:600}
.note{font-size:13px;color:var(--muted);background:var(--sunk);border-radius:12px;padding:10px 12px}

/* Stats */
.radar{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:8px}
.radar svg{display:block;width:100%;height:auto;max-width:100%}
.statrow{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:end}
.statrow .nm{font-family:var(--f-display);font-size:19px;display:flex;align-items:center;gap:8px}
.dot{width:10px;height:10px;border-radius:3px;display:inline-block}
.statrow .lv{font-family:var(--f-num);font-size:26px;font-weight:600;line-height:1}
.statrow .lv small{font-size:13px;color:var(--muted);font-weight:500}
.bar{grid-column:1/-1;height:8px;border-radius:99px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px}
.statrow .sub{grid-column:1/-1;display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}

/* History */
.hist{display:flex;flex-direction:column;gap:8px}
.hrow{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.hrow.miss{background:transparent;border-style:dashed}
.hrow .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.hrow .top b{font-family:var(--f-display);font-weight:400;font-size:17px}
.ev{font-size:12px}

/* Forms */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
label{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
input,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 10px;width:100%;min-width:0}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1 1 120px;min-width:0}
.btn{border:none;border-radius:12px;padding:11px 14px;background:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.danger{background:var(--bad);color:var(--surface)}
.btn:disabled{opacity:.5;cursor:default}
.mlist{display:flex;flex-direction:column}
.mitem{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.mitem:last-child{border-bottom:none}
.x{border:1px solid var(--line);background:transparent;border-radius:8px;padding:4px 10px;font-size:13px;flex:none}

/* Status tags + condition */
.status{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.stag{font-size:12px;font-weight:600;padding:1px 8px;border-radius:6px;background:var(--sunk)}
.cond{gap:12px}
.crow{display:flex;flex-direction:column;gap:6px}
.cn{font-size:13px;font-weight:600}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--sunk);border-radius:12px;padding:3px}
.seg button{border:none;background:transparent;border-radius:9px;padding:10px 2px;min-height:44px;font-size:13px;line-height:1.25;color:var(--muted);min-width:0}
.seg button.on{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.12)}


/* Category cards with sub-abilities */
.catcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.cathead{width:100%;border:none;background:transparent;display:grid;grid-template-columns:1fr auto 22px;grid-template-areas:"nm lv ch" "ss ss ss";gap:4px 10px;align-items:center;padding:12px 14px;text-align:left}
.cathead .nm{grid-area:nm;font-family:var(--f-display);font-size:19px;display:flex;align-items:center;gap:8px}
.cathead .lv{grid-area:lv;font-family:var(--f-num);font-size:24px;font-weight:600;line-height:1}
.cathead .lv small{font-size:12px;color:var(--muted);font-weight:500}
.cathead .chev{grid-area:ch;font-family:var(--f-num);font-size:20px;color:var(--muted);text-align:center}
.subsum{grid-area:ss;display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--muted)}
.subsum b{color:var(--ink)}
.subs{border-top:1px solid var(--line);display:flex;flex-direction:column}
.subrow{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:10px 14px;border-bottom:1px solid var(--line)}
.subrow:last-child{border-bottom:none}
.subrow .sn{font-weight:600}
.subrow .sl{font-size:20px;font-weight:600;line-height:1}
.subrow .bar,.subrow .sub{grid-column:1/-1}
.pill{font-size:11px;font-weight:600;padding:1px 8px;border-radius:999px;background:var(--sunk);color:var(--accent)}
.pill.neg{color:var(--bad)}
.grp{display:flex;justify-content:space-between;margin-top:4px}
.qtag{display:inline-block;font-size:11px;font-weight:600;border:1px solid currentColor;border-radius:6px;padding:0 6px;margin-right:6px;vertical-align:1px}
.brk.head span{font-size:12px;color:var(--muted)}
.brk.cat{font-family:var(--f-display);font-size:16px;border-bottom:none;padding-top:10px}
.brk:not(.cat):not(.head)>span:first-child{padding-left:10px}


.linkbtn{border:none;background:transparent;color:var(--accent);font-weight:600;font-size:13px;padding:6px 0;letter-spacing:0;text-transform:none}
.studies{display:flex;flex-direction:column;gap:8px}
.scard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px}
.stop{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.snm{font-family:var(--f-display);font-size:18px;line-height:1.2}
.slv{display:flex;flex-direction:column;align-items:flex-end;flex:none}
.slv .num:first-child{font-size:17px;font-weight:600}
.sbtns{display:flex;flex-wrap:wrap;gap:6px}
.sbtn{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:8px 12px;font-size:13px;min-height:40px}
.sbtn b{color:var(--c-intel)}
.sbtn.on{background:var(--c-intel);border-color:var(--c-intel);color:var(--surface)}
.sbtn.on b{color:var(--surface)}
.seg3{grid-template-columns:repeat(3,1fr)}
.sact{display:flex;gap:6px}
.x.danger{color:var(--bad);border-color:var(--bad)}


/* Time tiers, promotion tests, confidence */
.act.tier{cursor:default}
.tiers{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tbtn,.tiers .sbtn{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 10px;font-size:13px;min-height:40px}
.tbtn b{color:var(--accent)}
.tbtn.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tbtn.on b{color:var(--accent-ink)}
.waitbar{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;width:100%;border:1px solid var(--c-social);background:var(--surface);border-radius:14px;padding:10px 12px}
.waitbar b{font-family:var(--f-display);font-weight:400;font-size:17px;color:var(--c-social)}
.waitbar .small{color:var(--muted)}
.pill.wait{color:var(--c-social);font-size:11px;margin-left:6px;font-family:var(--f-body)}
.scard>.pill.wait{margin-left:0;align-self:flex-start}
.pills{display:flex;flex-wrap:wrap;gap:4px}
.bar.full i{background-image:repeating-linear-gradient(45deg,transparent 0 6px,rgba(255,255,255,.35) 6px 12px)}
.meas{grid-column:1/-1;background:var(--sunk);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.meas .btn{padding:9px 12px}
.critrow{display:flex;flex-direction:column;gap:4px}
.critrow input{font-family:var(--f-num);font-size:13px}
.pm{font-size:12px;color:var(--bad);font-weight:500;margin-left:2px}
.rules{line-height:1.7}

.filebtn{display:flex;align-items:center;justify-content:center;font-weight:600;color:var(--ink);font-size:15px;cursor:pointer;flex-direction:row}
.filebtn input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.filebtn:focus-within{outline:2px solid var(--accent);outline-offset:2px}


[hidden]{display:none!important}
.celeb[hidden]{display:none!important;pointer-events:none}
/* 나 레벨 · 칭호 */
.tchip{border:1px dashed var(--c-social);background:transparent;color:var(--c-social);border-radius:999px;padding:0 8px;font-size:13px;font-weight:600;line-height:1.6}
.streak{color:var(--c-body);font-weight:600}
.tchip.empty{color:var(--muted);border-color:var(--line);font-weight:500}
.plrow{grid-column:1/-1;display:grid;grid-template-columns:auto 1fr auto auto;gap:10px;align-items:center;border:none;background:transparent;padding:0;text-align:left}
.plrow b{font-family:var(--f-display);font-weight:400;font-size:16px;color:var(--c-social)}
.plbar{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden;display:block}
.plbar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--c-social),var(--accent))}
.plcard{gap:8px}
.plcard .sub{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;color:var(--muted)}
.plhead{display:flex;align-items:baseline;justify-content:space-between}
.plbig{font-family:var(--f-display);font-size:34px;line-height:1;color:var(--c-social)}
.ctier{font-size:12px;letter-spacing:.08em;font-weight:700;color:var(--muted)}
/* 퀘스트 */
.qstrip{display:flex;flex-direction:column;gap:6px;text-align:left;width:100%;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 12px}
.qs-h{display:flex;justify-content:space-between}
.qs-h b{font-family:var(--f-display);font-weight:400;font-size:17px}
.qs-l{display:flex;flex-direction:column;gap:2px;font-size:13px;color:var(--muted)}
.qs-l .qd{color:var(--accent);text-decoration:line-through}
.qcard{gap:4px}
.qrow{display:grid;grid-template-columns:26px 1fr auto auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.qrow:last-of-type{border-bottom:none}
.qchk{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:13px}
.qrow.done .qchk{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.qrow.done .qt{color:var(--muted);text-decoration:line-through}
.qxp{font-size:13px;font-weight:600;color:var(--c-social)}
.aprog{height:6px;border-radius:99px;background:var(--sunk);overflow:hidden;margin:6px 0 2px;width:100%}
.aprog i{display:block;height:100%;background:var(--accent);border-radius:99px}
.note.locked{border:1px dashed var(--line);background:transparent}
/* 업적 */
.achgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.achb{display:flex;flex-direction:column;align-items:center;gap:2px;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 4px 8px;min-width:0}
.achb .ab{width:84px;height:84px;display:block;margin:-6px 0 -4px}
.achb .ab svg{width:100%;height:100%}
.achb:not(.got) .ab{opacity:.55}
.achb .an{font-size:12px;font-weight:600;text-align:center;line-height:1.3;word-break:keep-all}
.achb:not(.got) .an{color:var(--muted)}
.at{font-size:10px;font-weight:700;letter-spacing:.06em}
.at.t0{color:#B8692E}.at.t1{color:var(--muted)}.at.t2{color:#C89400}.at.t3{color:#8B5CF6}
.achb.got.t3,.achb.got{box-shadow:none}
.unl{gap:0}
.urow{display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.urow:last-child{border-bottom:none}
.ulv{font-weight:600;color:var(--muted)}
.urow.ok .ulv{color:var(--c-social)}
.un{font-weight:600}
.advtag{display:inline-block;font-size:10px;font-weight:700;color:var(--c-social);border:1px solid currentColor;border-radius:5px;padding:0 4px;margin-right:6px;vertical-align:2px}
.advlock{padding:2px 4px}
.tlist{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-height:40vh;overflow:auto;padding:4px}
.tpick{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:8px 12px;font-size:14px}
.tpick.on{border-color:var(--c-social);color:var(--c-social);font-weight:700}
.seg4{grid-template-columns:repeat(4,1fr)}
.seg button:disabled{opacity:.45}
/* 달성 연출 */
.celeb{position:fixed;inset:0;z-index:30;background:rgba(6,12,14,.72);display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.cbox{position:relative;overflow:hidden;background:var(--surface);color:var(--ink);border-radius:24px;padding:24px 20px 18px;width:100%;max-width:340px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;--ray:#9FB0BC;animation:cpop .55s cubic-bezier(.2,1.5,.4,1)}
.cbox.t0{--ray:#C27838}.cbox.t2{--ray:#F0C02F}.cbox.t3{--ray:#B38CFF}
.cbox>*{position:relative}
.cbox h2{font-size:26px}
.cbox p{margin:0;color:var(--muted);font-size:14px}
.cbox .btn{margin-top:10px;width:100%}
.crew{font-size:13px;font-weight:600;color:var(--c-social)}
.rays{position:absolute!important;left:50%;top:-70px;width:420px;height:420px;margin-left:-210px;border-radius:50%;
  background:repeating-conic-gradient(var(--ray) 0deg 9deg,transparent 9deg 22.5deg);opacity:.32;
  -webkit-mask:radial-gradient(circle,#000 18%,transparent 62%);mask:radial-gradient(circle,#000 18%,transparent 62%);animation:spin 16s linear infinite}
.cbadge{width:156px;height:156px;animation:bin .9s cubic-bezier(.2,1.4,.3,1) both;filter:drop-shadow(0 8px 14px rgba(0,0,0,.25))}
.cbadge.sm{width:120px;height:120px;animation:none}
.cbadge svg{width:100%;height:100%}

/* gateOk(nl): nl이 10의 배수일 때 승급 시험을 통과했는지. 통과 전에는 경험치가 가득 찬 채로 멈춤 */
function applyXP(s,amt,gateOk){
  s.xp+=amt;s.wait=0;
  while(s.lvl<100&&s.xp>=need(s.lvl)){
    const nl=s.lvl+1;
    if(isGate(nl)&&!gateOk(nl)){s.xp=need(s.lvl);s.wait=nl;break}
    s.xp-=need(s.lvl);s.lvl++;
  }
  if(s.lvl>=100){s.lvl=100;s.xp=0}
  while(s.xp<0&&s.lvl>0){s.lvl--;s.xp+=need(s.lvl)}
  if(s.xp<0)s.xp=0;
}

function replay(st){
  const today=todayStr();

  const passed=(k,base,nl,d)=>nl<=base||tests.some(r=>r.k===k&&r.date<=d&&r.gates.includes(nl));
  const cur={};SUBS.forEach(s=>cur[s.k]={lvl:st.base[s.k],xp:Math.floor(need(st.base[s.k])/2),wait:0});
  const acts=Object.fromEntries(st.acts.map(a=>[a.id,a]));
  const studies=st.studies||[];const scur={};
  studies.forEach(s=>scur[s.id]={lvl:s.base,xp:Math.floor(need(s.base)/2),wait:0});
  const days=[];let d=st.startDate,g=0;
  while(d<=today&&g++<4000){
    const log=st.logs[d]||[];const cond=(st.cond||{})[d];const sl=(st.slogs||{})[d]||{};let studied=false;
    const delta=Object.fromEntries(SUBS.map(s=>[s.k,0]));const taxed={};const sdelta={},stax={};
    const anyS=Object.values(sl).some(a=>a&&a.length);
    const kind=(log.length||cond||anyS)?'log':d<today?'miss':'none';
    log.forEach(id=>{const a=acts[id];if(!a)return;for(const k in a.fx)if(SUB[k])delta[k]+=a.fx[k]});
    studies.forEach(s=>{
      if(d<s.start||paused(s,d))return;
      const a=(sl[s.id]||[]).filter(k=>sAct(s,k));let x=0;
      a.forEach(k=>x+=sAct(s,k)[2]);
      if(a.length)studied=true;
      const tx=tax(scur[s.id].lvl,'intel');if(tx){x-=tx;stax[s.id]=tx}
      sdelta[s.id]=x;
    });
    if(studied)delta.know+=1;           // 공부 목록을 공부한 날은 지식 +1 (과목 수와 상관없이 하루 한 번)
    SUBS.forEach(s=>{const tx=tax(cur[s.k].lvl,s.cat);if(tx){delta[s.k]-=tx;taxed[s.k]=tx}});   // 하루 기본 차감
    const cf=condFx(cond);for(const k in cf)if(SUB[k])delta[k]+=cf[k];
    const ev=[],sev=[];
    SUBS.forEach(s=>{const c=cur[s.k],b=c.lvl;applyXP(c,delta[s.k],nl=>passed(s.k,st.base[s.k],nl,d));if(c.lvl!==b)ev.push({k:s.k,from:b,to:c.lvl})});
    for(const id in sdelta){const s=studies.find(z=>z.id===id),c=scur[id],b=c.lvl;applyXP(c,sdelta[id],nl=>passed(id,s.base,nl,d));if(c.lvl!==b)sev.push({id,from:b,to:c.lvl})}
    days.push({d,kind,delta,taxed,ev,sdelta,stax,sev,snap:Object.fromEntries(SUBS.map(s=>[s.k,cur[s.k].lvl])),ssnap:Object.fromEntries(studies.map(s=>[s.id,scur[s.id].lvl]))});
    d=addDays(d,1);
  }
  return {cur,days,scur};
}

function migrate(s){
  s=migrate3(s);if(!s||s.v>=4)return s;
  const acts=JSON.parse(JSON.stringify(DEFAULT_ACTS));
  (s.acts||[]).filter(isCustom).forEach(a=>acts.push(a));
  const ids=new Set(acts.map(a=>a.id));const logs={};
  for(const d in s.logs||{}){const l=s.logs[d].filter(id=>ids.has(id));if(l.length)logs[d]=l}
  const slogs={};
  for(const d in s.slogs||{}){slogs[d]={};for(const id in s.slogs[d]){const st=(s.studies||[]).find(z=>z.id===id);if(!st)continue;const al=S_ALIAS[st.type]||{};
    slogs[d][id]=[...new Set(s.slogs[d][id].map(k=>al[k]||k))]}}
  return Object.assign({},s,{v:4,acts,logs,slogs,studies:(s.studies||[]).map(z=>{const c=Object.assign({},z);delete c.lastHit;return c}),tests:s.tests||[],crit:s.crit||{}});
}
function migrate3(s){
  if(!s||s.v>=3)return s;
  const base={};SUBS.forEach(x=>base[x.k]=s.base[x.cat]!=null?s.base[x.cat]:30);
  const acts=JSON.parse(JSON.stringify(DEFAULT_ACTS));
  (s.acts||[]).filter(isCustom).forEach(a=>{
    const fx={};for(const k in a.fx){const nk=OLD_CAT_SUB[k]||k;if(SUB[nk])fx[nk]=a.fx[k]}
    if(Object.keys(fx).length)acts.push({id:a.id,name:a.name,fx,bad:a.bad})});
  const ids=new Set(acts.map(a=>a.id));const logs={};
  for(const d in s.logs||{}){const l=[...new Set(s.logs[d].map(id=>OLD_ACT[id]||id).filter(id=>ids.has(id)))];if(l.length)logs[d]=l}
  return {v:3,name:s.name||'나',base,startDate:s.startDate,diagnosedAt:s.diagnosedAt||s.startDate,acts,logs,cond:s.cond||{},migratedFrom:s.v||1};
}

  }[pot]||`<path d="M14 62 Q38 56 62 62" stroke="${soil}" stroke-width="3" fill="none" stroke-linecap="round"/>`;
  const parts=[base];

function radar(vals){
  const W=320,H=290,cx=160,cy=150,R=100,N=CATS.length;
  const pt=(i,v)=>{const a=-Math.PI/2+i*2*Math.PI/N;return[cx+Math.cos(a)*R*v/100,cy+Math.sin(a)*R*v/100]};
  let g='';
  [20,40,60,80,100].forEach(v=>{g+=`<polygon points="${CATS.map((c,i)=>pt(i,v).join(',')).join(' ')}" fill="none" stroke="var(--line)" stroke-width="1"/>`});
  CATS.forEach((c,i)=>{const[x,y]=pt(i,100);g+=`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="var(--line)"/>`});
  [50,100].forEach(v=>{g+=`<text x="${cx+4}" y="${cy-R*v/100+12}" font-size="10" fill="var(--muted)" font-family="IBM Plex Mono,monospace">${v}</text>`});
  g+=`<polygon points="${CATS.map((c,i)=>pt(i,vals[c.k]).join(',')).join(' ')}" fill="var(--accent)" fill-opacity=".22" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>`;
  CATS.forEach((c,i)=>{const[x,y]=pt(i,vals[c.k]);g+=`<circle cx="${x}" cy="${y}" r="4.5" fill="var(--c-${c.k})"/>`;
    const[lx,ly]=pt(i,124);const anchor=Math.abs(lx-cx)<8?'middle':lx>cx?'start':'end';
    g+=`<text x="${lx}" y="${ly+4}" text-anchor="${anchor}" font-size="14" fill="var(--ink)" font-family="Do Hyeon,sans-serif">${c.n} <tspan font-family="IBM Plex Mono,monospace" font-size="12" fill="var(--c-${c.k})">${vals[c.k]}</tspan></text>`});
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="분야별 능력치 오각형 그래프">${g}</svg>`;
}

/* 날짜로 정해지는 난수: 같은 날에는 같은 퀘스트 */
function rng(seed){let h=1779033703^seed.length;for(let i=0;i<seed.length;i++){h=Math.imul(h^seed.charCodeAt(i),3432918353);h=h<<13|h>>>19}
  return()=>{h=Math.imul(h^h>>>16,2246822507);h=Math.imul(h^h>>>13,3266489909);h^=h>>>16;return(h>>>0)/4294967296}}
function wpick(list,w,r){const tot=list.reduce((a,x)=>a+w(x),0);let t=r()*tot;for(const x of list){t-=w(x);if(t<=0)return x}return list[list.length-1]}
function pickDaily(d,cur,exclude,n,salt){
  const r=rng('d'+d+(salt||''));const out=[],used=new Set();
  const w=q=>1+Math.max(0,70-(q.sub&&cur[q.sub]?cur[q.sub].lvl:50))/15;   // 약한 능력일수록 자주
  const pool=DQ.filter(q=>!(exclude||[]).includes(q.id));
  if(n===3){const e=wpick(pool.filter(q=>q.easy),w,r);out.push(e.id);if(e.sub)used.add(e.sub)}
  while(out.length<n){const c=pool.filter(q=>!q.easy&&!out.includes(q.id)&&!(q.sub&&used.has(q.sub)));if(!c.length)break;
    const q=wpick(c,w,r);out.push(q.id);if(q.sub)used.add(q.sub)}
  return out;
}
function pickWeekly(wk,cur){
  const r=rng('w'+wk);const cl=catLevels(cur);const out=[],used=new Set();
  const w=q=>q.cat?1+Math.max(0,70-cl[q.cat])/15:1.2;
  while(out.length<3){const c=WQ.filter(q=>!out.includes(q.id)&&!used.has(q.cat||'meta'));if(!c.length)break;
    const q=wpick(c,w,r);out.push(q.id);used.add(q.cat||'meta')}
  return out;
}
function ensureQuests(R,P){
  const t=todayStr();let changed=false;
  if(!state.quests)state.quests={d:{},w:{}};
  if(!state.quests.d[t]){state.quests.d[t]={ids:pickDaily(t,R.cur,[],3),rr:false};changed=true}
  if(has(P,'weekly')){const wk=weekKey(t);if(!state.quests.w[wk]){state.quests.w[wk]={ids:pickWeekly(wk,R.cur)};changed=true}}
  return changed;
}

const ACH_XP=[20,50,100,200], TIER_N=['브론즈','실버','골드','전설'];

function progress(st,R){
  const acts=Object.fromEntries(st.acts.map(a=>[a.id,a]));const bad=badIds(st);const today=todayStr();
  const S={dqStreak:0,logDays:0,streak:0,ups:0,gates:0,minCat:0,maxSub:0,study3:0,studyMin:0,studiesAdded:0,cardio:0,strength:0,med:0,social:0,tidy:0,sleep:0,cleanStreak:0,dqAllDays:0,dqDone:0,wqAll:0,tests:0};
  let xp=st.devXP||0,wqDone=0;const ach={},dq={},wq={},frozen={};const Q=st.quests||{d:{},w:{}};
  const fz=(st.buys||[]).filter(b=>b.id==='freeze').map(b=>b.date).sort();let fzi=0,fzHave=0;
  R.days.forEach(day=>{
    const d=day.d,log=st.logs[d]||[];
    while(fzi<fz.length&&fz[fzi]<=d){fzHave++;fzi++}
    log.forEach(id=>{const a=acts[id];if(a)for(const k in a.fx)if(a.fx[k]>0)xp+=a.fx[k]});
    const sl=(st.slogs||{})[d]||{};
    for(const id in sl){const s=(st.studies||[]).find(z=>z.id===id);if(s)sl[id].forEach(k=>{const a=sAct(s,k);if(a)xp+=a[2]})}
    // 빼먹은 날: 보호권이 있으면 자동으로 쓰여서 연속 기록 유지 (능력치 차감은 그대로)
    if(day.kind==='log'){S.logDays++;S.streak++}else if(d<today){if(fzHave>0&&S.streak>0){fzHave--;frozen[d]=1}else S.streak=0}
    if(day.kind==='log'&&isCleanDay(d,st))S.cleanStreak++;else if(d<today||log.some(id=>bad.has(id)))S.cleanStreak=0;
    [...day.ev,...(day.sev||[])].forEach(e=>{if(e.to>e.from){S.ups++;if(Math.floor(e.to/10)>Math.floor(e.from/10))S.gates++}});
    const lv=day.snap;S.minCat=Math.min(...CATS.map(c=>catLv(lv,c)));S.maxSub=Math.max(...SUBS.map(s=>lv[s.k]));
    const m=studyMin(d,st);S.studyMin+=m;if(m>=180)S.study3++;
    S.studiesAdded=(st.studies||[]).filter(s=>s.start<=d).length;
    if(countOf(log,CARDIO))S.cardio++;if(countOf(log,STRENGTH))S.strength++;
    S.med+=countOf(log,['meditate','adv_calm']);S.social+=countOf(log,['deeptalk','newppl','speakup','adv_close','adv_talk']);
    S.tidy+=countOf(log,['tidyroom','chores','adv_tidy']);S.sleep+=countOf(log,['sleeptime']);
    S.tests=(st.tests||[]).filter(t=>t.date<=d).length;
    const q=Q.d[d];
    if(q){const done=q.ids.filter(id=>DQB[id]&&DQB[id].c(d,st));dq[d]=done;xp+=DQ_XP*done.length;S.dqDone+=done.length;
      if(q.ids.length===3&&done.length===3){xp+=DQ_BONUS;S.dqAllDays++;S.dqStreak++}else if(d<today)S.dqStreak=0}
    else if(d<today)S.dqStreak=0;
    if(toDate(d).getDay()===0||d===today){const wk=weekKey(d),w=Q.w[wk];
      if(w){const done=w.ids.filter(id=>WQB[id]&&WQB[id].v(wk,st,dq)>=WQB[id].n);wq[wk]=done;wqDone+=done.length;xp+=WQ_XP*done.length;if(done.length===3)S.wqAll++}}
    ACH.forEach(a=>{if(!ach[a.id]){const[v,n]=a.p(S);if(v>=n){ach[a.id]=d;xp+=ACH_XP[a.tier]}}});
  });
  const pl=plFromXP(xp);
  const seedsEarned=(st.devSeeds||0)+SEED_DQ*S.dqDone+SEED_DQ_ALL*S.dqAllDays+SEED_WQ*wqDone+ACH.filter(a=>ach[a.id]).reduce((n,a)=>n+SEED_ACH[a.tier],0)+SEED_PL*(pl.lvl-1);
  return {xp,pl,ach,dq,wq,S,frozen,fzHave,seedsEarned};
}

let celebQ=[],celebOpen=false;
function checkCelebrations(P){
  if(!state.seen)state.seen={ach:[],pl:1};
  const newA=ACH.filter(a=>P.ach[a.id]&&!state.seen.ach.includes(a.id));
  const plUp=P.pl.lvl>state.seen.pl;
  if(!newA.length&&!plUp)return;
  newA.forEach(a=>celebQ.push({type:'ach',a}));
  if(plUp)celebQ.push({type:'pl',from:state.seen.pl,to:P.pl.lvl});
  state.seen={ach:[...state.seen.ach,...newA.map(a=>a.id)],pl:Math.max(state.seen.pl,P.pl.lvl)};save();
  if(!celebOpen)showNextCeleb();
}

function showModal(html){const el=celebEl();el.innerHTML=html;el.hidden=false;celebOpen=true;const b=el.querySelector('.btn');if(b)b.focus({preventScroll:true})}

  if(c.type==='ach'){const a=c.a;
    h=`<div class="cbox t${a.tier}"><div class="rays" aria-hidden="true"></div><div class="spark s1"></div><div class="spark s2"></div><div class="spark s3"></div>

  else{const opened=UNLOCKS.filter(u=>u.lv>c.from&&u.lv<=c.to),nu=UNLOCKS.find(u=>u.lv>c.to),nt=PL_TITLES.filter(t=>t[0]>c.from&&t[0]<=c.to);

function growthChart(R){
  const days=R.days.slice(-30);if(days.length<2)return `<div class="note">기록이 이틀 이상 쌓이면 그래프가 그려져요.</div>`;
  const W=320,H=170,L=28,Rt=8,T=10,B=24;
  const series=CATS.map(c=>({c,v:days.map(x=>catLv(x.snap,c))}));
  const all=series.flatMap(s=>s.v);let lo=Math.max(0,Math.floor((Math.min(...all)-3)/5)*5),hi=Math.min(100,Math.ceil((Math.max(...all)+3)/5)*5);if(hi-lo<10)hi=lo+10;
  const x=i=>L+(W-L-Rt)*i/(days.length-1),y=v=>T+(H-T-B)*(1-(v-lo)/(hi-lo));
  const ticks=[lo,Math.round((lo+hi)/2),hi];
  let g=ticks.map(v=>`<line x1="${L}" x2="${W-Rt}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-4}" y="${y(v)+3}" text-anchor="end" font-size="9" fill="var(--muted)" font-family="IBM Plex Mono,monospace">${v}</text>`).join('');
  g+=series.map(s=>`<polyline points="${s.v.map((v,i)=>x(i).toFixed(1)+','+y(v).toFixed(1)).join(' ')}" fill="none" stroke="var(--c-${s.c.k})" stroke-width="2" stroke-linejoin="round"/><circle cx="${x(days.length-1)}" cy="${y(s.v[s.v.length-1])}" r="3" fill="var(--c-${s.c.k})"/>`).join('');
  const lab=d=>{const t=toDate(d);return `${t.getMonth()+1}/${t.getDate()}`};
  g+=`<text x="${L}" y="${H-6}" font-size="9" fill="var(--muted)" font-family="IBM Plex Mono,monospace">${lab(days[0].d)}</text><text x="${W-Rt}" y="${H-6}" text-anchor="end" font-size="9" fill="var(--muted)" font-family="IBM Plex Mono,monospace">${lab(days[days.length-1].d)}</text>`;
  return `<div class="card"><h3>30일 성장</h3><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="최근 30일 분야별 레벨 변화" style="width:100%;height:auto">${g}</svg>
    <div class="chips">${series.map(s=>`<span class="chip" style="color:var(--c-${s.c.k})">${s.c.n} <b>${s.v[s.v.length-1]}</b></span>`).join('')}</div></div>`;
}

    const big=stage===3?.6:stage===4?.85:1;
    parts.push(`<path d="M38 60V${44-6*big}M38 50L31 44M38 48L45 42" stroke="${BR}" stroke-width="${3+big*1.5}" stroke-linecap="round"/>`);
    const blobs=[[38,30,13],[27,36,10],[49,36,10],[32,26,9],[45,27,9]];
    const col=k==='cherry'&&stage===3?['#6FB57F','#4E9A62']:crown;
    blobs.forEach(([x,y,r],j)=>parts.push(`<circle cx="${x}" cy="${y+(1-big)*14}" r="${(r*big).toFixed(1)}" fill="${col[j%2]}"/>`));
    if(k==='tree'&&stage>=4)[[33,32],[44,30],[39,38],[29,40],[48,40]].slice(0,stage===4?3:5).forEach(([x,y])=>parts.push(`<circle cx="${x}" cy="${y+(1-big)*14}" r="2.2" fill="#E5484D"/>`));
    if(k==='cherry'&&stage===5)[[24,52],[52,55],[30,57]].forEach(([x,y])=>parts.push(`<circle cx="${x}" cy="${y}" r="1.8" fill="#F6A9C6"/>`));
    if(k==='maple'&&stage===5)[[26,55],[50,53]].forEach(([x,y])=>parts.push(`<path d="M${x} ${y-3}L${x+2} ${y}L${x} ${y+3}L${x-2} ${y}Z" fill="#E8743B"/>`));
  }
  return `<svg viewBox="0 0 76 76" width="${size||64}" height="${size||64}" aria-hidden="true">${parts.join('')}</svg>`;
}

let devMode=false,realState=null,verTaps=0,verTimer=null;
const QUEST_ACT={meals:'meals',planday:'planday',reach:'reachout',study1:'study',study2:'study120',cardio:'cardio',walk:'walk',upper:'upperw',lower:'lowerw',deep:'deep60',read:'read',write:'write',meditate:'meditate',journal:'journal',hard:'hardtask',talk:'deeptalk',speak:'speakup',tidy:'tidyroom',chores:'chores',sleep:'sleeptime',plandone:'plandone'};
function enterDev(){realState=state;state=JSON.parse(JSON.stringify(state));devMode=true;devOffset=0;viewDay=todayStr();render();window.scrollTo(0,0);showToast('테스트 모드를 켰어요. 실제 기록에는 저장되지 않아요.')}
function exitDev(){state=realState;realState=null;devMode=false;devOffset=0;viewDay=todayStr();closeModal();render();window.scrollTo(0,0);showToast('테스트 모드를 끄고 실제 기록으로 돌아왔어요.')}
function devTapVersion(){
  if(devMode){showToast('이미 테스트 모드예요.');return}
  verTaps++;clearTimeout(verTimer);verTimer=setTimeout(()=>verTaps=0,1500);   // 1.5초 안에 이어서 15번 눌러야 켜짐. 남은 횟수는 알려주지 않음
  if(verTaps>=15){verTaps=0;enterDev()}
}
function devFill(days){
  const pos=state.acts.filter(a=>!a.bad&&!a.adv),bad=state.acts.filter(a=>a.bad),r=Math.random;
  for(let i=days;i>=0;i--){
    const d=addDays(todayStr(),-i);if(d<state.startDate)state.startDate=d;
    const pick=new Set();const n=Math.min(3+Math.floor(r()*4),new Set(pos.map(a=>a.grp||a.id)).size);let tries=0;
    while(pick.size<n&&tries++<200){const a=pos[Math.floor(r()*pos.length)];if(a.grp&&[...pick].some(id=>(state.acts.find(x=>x.id===id)||{}).grp===a.grp))continue;pick.add(a.id)}
    if(bad.length&&r()<.2)pick.add(bad[Math.floor(r()*bad.length)].id);
    state.logs[d]=[...pick];
    state.cond[d]=Object.fromEntries(COND.map(q=>[q.k,Math.floor(r()*4)]));
    (state.studies||[]).filter(s=>!s.archived).forEach(s=>{if(r()<.6){state.slogs[d]=Object.assign({},state.slogs[d],{[s.id]:[['t60','t120','t180'][Math.floor(r()*3)]]})}});
  }
}
function devCompleteQuests(){
  const t=todayStr(),q=state.quests.d[t];if(!q)return;const log=new Set(state.logs[t]||[]);
  q.ids.forEach(id=>{if(id==='cond')state.cond[t]=Object.fromEntries(COND.map(c=>[c.k,2]));else if(QUEST_ACT[id])log.add(QUEST_ACT[id])});
  state.logs[t]=[...log];
}

    <div class="devsec"><b>날짜 이동</b><div class="devrow"><button type="button" class="x" data-dev="d-1">−1일</button><button type="button" class="x" data-dev="d+1">+1일</button><button type="button" class="x" data-dev="d+7">+7일</button><button type="button" class="x" data-dev="d0">오늘로</button></div>

    <button type="button" class="btn" data-cclose>닫기</button></div>`);
  const el=celebEl();el.querySelector('[data-cclose]').onclick=closeModal;
  el.querySelectorAll('[data-dev]').forEach(b=>b.onclick=()=>devAct(b.dataset.dev));

function devAct(a){
  const again=()=>{closeModal();viewDay=todayStr();render();devPanel()};
  if(a.startsWith('d')&&a!=='del1'){devOffset=a==='d0'?0:devOffset+parseInt(a.slice(1),10);return again()}
  if(a==='f0'){devFill(0);return again()}
  if(a==='f7'){devFill(7);return again()}
  if(a==='f30'){devFill(30);return again()}
  if(a==='del1'){const y=addDays(todayStr(),-1);delete state.logs[y];delete state.cond[y];delete (state.slogs||{})[y];return again()}
  if(a==='qdone'){devCompleteQuests();return again()}
  if(a==='qnew'){delete state.quests.d[todayStr()];return again()}
  if(a==='seed'){state.devSeeds=(state.devSeeds||0)+100;return again()}
  if(a==='pxp'){state.devXP=(state.devXP||0)+200;return again()}
  if(a==='lv'){const k=$('#devSub').value,v=Math.max(0,Math.min(100,Math.round(+$('#devLv').value||0)));state.base=Object.assign({},state.base,{[k]:v});return again()}
  if(a==='all29'||a==='all85'){const v=a==='all29'?29:85;state.base=Object.fromEntries(SUBS.map(s=>[s.k,v]));return again()}
  if(a[0]==='c'&&a!=='cpl'){closeModal();const t=+a.slice(1);const ach=ACH.filter(x=>x.tier===t);celebQ.push({type:'ach',a:ach[Math.floor(Math.random()*ach.length)]});showNextCeleb();return}
  if(a==='cpl'){closeModal();celebQ.push({type:'pl',from:curP.pl.lvl,to:curP.pl.lvl+1});showNextCeleb();return}
  if(a==='reset'){state=JSON.parse(JSON.stringify(realState));devOffset=0;return again()}
  if(a==='exit')return exitDev();
}

     ${x.ev.length||(x.sev||[]).length?`<div class="ev">${[...x.ev.map(e=>`<span class="${e.to>e.from?'pos':'neg'}">${SUB[e.k].n} Lv ${e.from} → ${e.to}</span>`),...(x.sev||[]).map(e=>{const s=state.studies.find(z=>z.id===e.id);return s?`<span class="${e.to>e.from?'pos':'neg'}">${esc(s.name)} Lv ${e.from} → ${e.to}</span>`:''})].join(' · ')}</div>`:''}
    </div>`}).join('')}</div></section>`;
}

/* ---------- 진단: step 0 이름 · 1~5 분야별 자기 평가 · 6 실제 이력 · 7 결과 ---------- */
const NC=CATS.length, SPEC_STEP=NC+1, RESULT_STEP=NC+2;
const TOTAL_Q=CATS.reduce((a,c)=>a+QSETS[c.k].length,0)+SPEC.length;
function newOnboard(keep){return {name:state?state.name:'',ans:Object.fromEntries(CATS.map(c=>[c.k,[]])),spec:[],step:keep?1:0,keep:!!keep}}
function answered(){return CATS.reduce((a,c)=>a+onboard.ans[c.k].filter(v=>v!=null).length,0)+onboard.spec.filter(v=>v!=null).length}
function selfScore(){
  const sum={},cnt={};SUBS.forEach(s=>{sum[s.k]=0;cnt[s.k]=0});
  CATS.forEach(c=>QSETS[c.k].forEach((q,i)=>{const v=onboard.ans[c.k][i];if(v!=null){sum[q[0]]+=v;cnt[q[0]]++}}));
  return Object.fromEntries(SUBS.map(s=>[s.k,Math.round(10+(cnt[s.k]?sum[s.k]/cnt[s.k]:1)*20)]));   // 평균 0~3점 → 10~70
}
function specBonus(){
  const b=Object.fromEntries(SUBS.map(s=>[s.k,0]));
  SPEC.forEach((q,i)=>{const v=onboard.spec[i];if(v!=null)b[q.k]+=q.b[v]});
  SUBS.forEach(s=>b[s.k]=Math.min(BONUS_CAP,b[s.k]));return b;
}
function computeBase(){const a=selfScore(),b=specBonus();return Object.fromEntries(SUBS.map(s=>[s.k,Math.min(BASE_CAP,a[s.k]+b[s.k])]))}
function stepDone(st){
  if(st>=1&&st<=NC){const c=CATS[st-1];return QSETS[c.k].every((q,i)=>onboard.ans[c.k][i]!=null)}
  if(st===SPEC_STEP)return SPEC.every((q,i)=>onboard.spec[i]!=null);
  return true;
}
const optBtns=(opts,sel,q)=>`<div class="opts">${opts.map((o,j)=>`<button type="button" class="opt${sel===j?' on':''}" data-q="${q}" data-o="${j}" aria-pressed="${sel===j}">${o}</button>`).join('')}</div>`;
const ieyo=w=>{const c=w.charCodeAt(w.length-1)-0xAC00;return c>=0&&c<11172&&c%28?'이에요':'예요'};
const subTag=k=>`<span class="qtag" style="color:${color(k)}">${SUB[k].n}</span>`;
function renderOnboard(){
  if(!onboard)onboard=newOnboard(false);
  const st=onboard.step;
  const prog=`<div class="prog"><i id="progBar" style="width:${Math.round(answered()/TOTAL_Q*100)}%"></i></div><div class="small muted">상태 진단 <span class="num" id="progNum">${answered()}/${TOTAL_Q}</span></div>`;
  const nav=label=>`<div class="row"><button type="button" class="btn ghost" id="obPrev">${st===1&&onboard.keep?'취소':'이전'}</button><button type="button" class="btn" id="obNext" ${stepDone(st)?'':'disabled'}>${label}</button></div>`;
  if(st===0)return `<section class="panel">
    <div><h2>나 키우기</h2><p class="intro">${TOTAL_Q}개 질문으로 지금의 나를 진단해서 세부 능력 15개의 시작 레벨을 정해요. 생활 습관에 대한 자기 평가에 학력·실적 같은 실제 이력이 더해져요. 그다음부터는 매일의 컨디션과 한 일, 안 한 일에 따라 능력이 자라거나 줄어들어요.</p></div>
    <div class="card"><label for="obName">캐릭터 이름<input id="obName" maxlength="20" placeholder="나" value="${esc(onboard.name)}"></label></div>
    <button type="button" class="btn" id="obNext">진단 시작하기</button></section>`;
  if(st<=NC){
    const c=CATS[st-1];const a=onboard.ans[c.k];
    return `<section class="panel">${prog}
      <div class="qhead"><span class="dot" style="background:var(--c-${c.k})"></span><h2>${c.n}</h2><span class="small muted num">${st} / ${NC+1}</span></div>
      ${QSETS[c.k].map((q,i)=>`<div class="card q"><div class="qt">${subTag(q[0])}${q[1]}</div>${optBtns(q[2],a[i],i)}</div>`).join('')}
      ${nav('다음')}</section>`;
  }
  if(st===SPEC_STEP){
    let h=`<section class="panel">${prog}
      <div class="qhead"><span class="dot" style="background:var(--accent)"></span><h2>실제 이력</h2><span class="small muted num">${NC+1} / ${NC+1}</span></div>
      <div class="note">지금까지 쌓아온 기록과 경험이에요. 자기 평가 점수에 보너스로 더해져요 (세부 능력마다 최대 +${BONUS_CAP}). 해당 없으면 첫 번째 보기를 고르세요.</div>`;
    CATS.forEach(c=>{const qs=SPEC.map((q,i)=>[q,i]).filter(([q])=>SUB[q.k].cat===c.k);if(!qs.length)return;
      h+=`<div class="sec-label" style="color:var(--c-${c.k})">${c.n}</div>`+qs.map(([q,i])=>`<div class="card q"><div class="qt">${subTag(q.k)}${q.t}</div>${optBtns(q.o,onboard.spec[i],i)}</div>`).join('')});
    return h+nav('결과 보기')+'</section>';
  }
  const base=computeBase(),self=selfScore(),bonus=specBonus();
  const cl=Object.fromEntries(CATS.map(c=>[c.k,catLv(base,c)]));
  const sorted=SUBS.slice().sort((x,y)=>base[y.k]-base[x.k]);
  const strong=sorted[0],weak=sorted[sorted.length-1];
  const avg=avgOf(cl);
  return `<section class="panel">${prog}
    <div><h2>진단 결과</h2><p class="intro">지금의 ${esc(onboard.name.trim()||'나')}는 평균 <b class="num">Lv ${avg}</b>, ‘${titleOf(avg)}’ 단계예요. 가장 강한 능력은 <b style="color:${color(strong.k)}">${strong.n}</b>, 가장 키울 여지가 큰 능력은 <b style="color:${color(weak.k)}">${weak.n}</b>${ieyo(weak.n)}.</p></div>
    <div class="radar">${radar(cl)}</div>
    <div class="card"><div class="brk head"><span></span><span>자기 평가</span><span>이력</span><span>시작</span></div>
      ${CATS.map(c=>`<div class="brk cat"><span style="color:var(--c-${c.k})">${c.n}</span><span></span><span></span><span class="num">${cl[c.k]}</span></div>`+
        c.subs.map(([k])=>`<div class="brk"><span>${SUB[k].n}</span><span class="num">${self[k]}</span><span class="num ${bonus[k]?'pos':'zero'}">+${bonus[k]}</span><span class="num"><b>${base[k]}</b></span></div>`).join('')).join('')}</div>
    ${onboard.keep?'<div class="note">지금까지의 기록은 새 시작 능력치 위에서 다시 계산돼요.</div>':''}
    <div class="row"><button type="button" class="btn ghost" id="obPrev">다시 답하기</button><button type="button" class="btn" id="startBtn">${onboard.keep?'이 능력치로 바꾸기':'이 능력치로 시작하기'}</button></div>
  </section>`;
}
function bindOnboard(){
  const n=$('#obName');if(n)n.addEventListener('input',()=>onboard.name=n.value);
  const st=onboard.step;
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    const q=+b.dataset.q,o=+b.dataset.o;
    if(st===SPEC_STEP)onboard.spec[q]=o;else onboard.ans[CATS[st-1].k][q]=o;
    b.parentNode.querySelectorAll('.opt').forEach(x=>{const on=x===b;x.classList.toggle('on',on);x.setAttribute('aria-pressed',on)});
    const nx=$('#obNext');if(nx)nx.disabled=!stepDone(st);
    $('#progBar').style.width=Math.round(answered()/TOTAL_Q*100)+'%';$('#progNum').textContent=answered()+'/'+TOTAL_Q;
  });
  const nx=$('#obNext');if(nx)nx.onclick=()=>{if(!stepDone(st))return;onboard.step++;render();window.scrollTo(0,0)};
  const pv=$('#obPrev');if(pv)pv.onclick=()=>{
    if(st===1&&onboard.keep){onboard=null;render();return}
    onboard.step=st===RESULT_STEP?1:st-1;render();window.scrollTo(0,0)};
  const s=$('#startBtn');if(s)s.onclick=()=>{
    if(onboard.keep&&state){state.base=computeBase();state.diagnosedAt=todayStr()}
    else state={v:4,name:onboard.name.trim()||'나',base:computeBase(),startDate:todayStr(),diagnosedAt:todayStr(),acts:JSON.parse(JSON.stringify(DEFAULT_ACTS)),knownDefaults:DEFAULT_ACTS.map(a=>a.id),logs:{},cond:{},studies:[],slogs:{},tests:[],crit:{},quests:{d:{},w:{}},seen:{ach:[],pl:1}};
    onboard=null;tab='today';viewDay=todayStr();save();render();window.scrollTo(0,0);
  };
}

/* ---------- HTML 파일로 저장 · 불러오기 ---------- */
let impPending=null;
function savedLabel(){return state&&state.savedAt?`마지막 자동 저장 ${fmtDay(state.savedAt.slice(0,10))} ${state.savedAt.slice(11,16)} (UTC) · ${ref?'내 계정':'이 기기'}`:''}
function buildHTML(){
  // 이 앱의 화면 구조·스타일·코드에 지금 기록을 넣어 혼자 열리는 파일을 만듦
  const style=document.getElementById('app-css').outerHTML;
  const code=document.getElementById('app-js').textContent;
  const data=JSON.stringify(state).replace(/</g,'\\u003c');
  return '<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">'
    +'<title>나 키우기</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">'
    +style+'<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:15px}[hidden]{display:none!important}</style></head><body>'
    +'<div class="wrap" id="app"></div>'
    +'<nav class="tabs" id="tabs" hidden><div class="in"><button id="tab-today" data-tab="today">오늘</button><button id="tab-quest" data-tab="quest">도전</button><button id="tab-stats" data-tab="stats">능력치</button><button id="tab-hist" data-tab="hist">기록</button><button id="tab-set" data-tab="set">설정</button></div></nav>'
    +'<div class="toast" id="toast" hidden></div>'
    +'<script type="application/json" id="savedata">'+data+'</'+'script>'
    +'<script id="app-js">'+code+'</'+'script></body></html>';
}
async function exportHTML(){
  if(!state.savedAt)state.savedAt=new Date().toISOString();
  const name=(state.name||'나').replace(/[\\/:*?"<>|]/g,'').trim()||'나';
  const filename=`나키우기-${name}-${todayStr()}.html`;
  const html=buildHTML();
  let dl=null;try{dl=window.claude?await window.claude.use('downloads'):null}catch(e){}
  if(dl){
    try{await dl.save({filename,data:new Blob([html],{type:'text/html'})});showToast('HTML 파일로 저장했어요.')}
    catch(e){if(e&&e.code==='declined')showToast('저장을 취소했어요.');else if(e&&e.code==='rate_limited')showToast('이미 저장 창이 열려 있어요. 잠시 후 다시 눌러 주세요.');else showToast('여기서는 파일을 저장할 수 없어요. 브라우저에서 앱을 열어 다시 시도해 주세요.')}
    return;
  }
  // 따로 저장한 파일을 브라우저에서 열었을 때
  try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([html],{type:'text/html'}));a.download=filename;document.body.appendChild(a);a.click();
    setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000);showToast('HTML 파일로 저장했어요.')}
  catch(e){showToast('여기서는 파일을 저장할 수 없어요.')}
}
function readSaved(text){
  try{const j=JSON.parse(text);if(validShape(j))return j}catch(e){}
  try{const doc=new DOMParser().parseFromString(text,'text/html');const el=doc.getElementById('savedata');if(el){const j=JSON.parse(el.textContent);if(validShape(j))return j}}catch(e){}
  return null;
}
function bindBackup(){
  const ex=$('#expHtml');if(ex)ex.onclick=()=>exportHTML();
  const f=$('#impFile');if(f)f.addEventListener('change',()=>{const file=f.files&&f.files[0];if(!file)return;
    const r=new FileReader();r.onload=()=>{const j=readSaved(String(r.result));
      if(!j){showToast('나 키우기에서 저장한 파일이 아니에요.');f.value='';return}
      impPending=j;keepScroll(render)};r.readAsText(file)});
  const n=$('#impNo');if(n)n.onclick=()=>{impPending=null;keepScroll(render)};
  const y=$('#impYes');if(y)y.onclick=()=>{adopt(JSON.parse(JSON.stringify(impPending)));impPending=null;viewDay=todayStr();save();keepScroll(render);showToast('저장한 파일의 기록으로 바꿨어요.')};
}

/* ---------- 이벤트 ---------- */
function bind(){
  document.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>commit(()=>{
    const id=b.dataset.act,log=state.logs[viewDay]||[];
    const a=state.acts.find(x=>x.id===id);
    state.logs[viewDay]=log.includes(id)?log.filter(x=>x!==id):[...log.filter(x=>!a||!a.grp||(state.acts.find(y=>y.id===x)||{}).grp!==a.grp),id];
    if(!state.logs[viewDay].length)delete state.logs[viewDay];
  }));
  document.querySelectorAll('[data-ck]').forEach(b=>b.onclick=()=>commit(()=>{
    const c=Object.assign({},state.cond[viewDay]);const k=b.dataset.ck,v=+b.dataset.cv;
    if(c[k]===v)delete c[k];else c[k]=v;
    if(Object.keys(c).length)state.cond[viewDay]=c;else delete state.cond[viewDay];
  }));
  document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{const k=b.dataset.cat;openCats.has(k)?openCats.delete(k):openCats.add(k);const y=window.scrollY;render();window.scrollTo(0,y)});
  const p=$('#prevDay'),nx=$('#nextDay');
  if(p)p.onclick=()=>{viewDay=addDays(viewDay,-1);render()};
  if(nx)nx.onclick=()=>{viewDay=addDays(viewDay,1);render()};
  const ni=$('#nameIn');if(ni)ni.addEventListener('change',()=>{state.name=ni.value.trim()||'나';save();render()});
  document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{
    const id=b.dataset.del;state.acts=state.acts.filter(a=>a.id!==id);
    for(const d in state.logs){state.logs[d]=state.logs[d].filter(x=>x!==id);if(!state.logs[d].length)delete state.logs[d]}
    const y=window.scrollY;save();render();window.scrollTo(0,y)});
  const add=$('#addAct');if(add)add.onclick=()=>{
    const name=$('#newName').value.trim();const kind=CUSTOM_KINDS.find(k=>k[0]===$('#newKind').value);const xp=kind[2];
    if(!name){showToast('활동 이름을 적어 주세요.');return}
    if(xp>0&&customPos().length>=slots(curP)){showToast(slots(curP)?`나만의 활동 칸이 가득 찼어요. 나 Lv ${[3,12,20][slots(curP)]||'-'}에 한 칸 더 열려요.`:'나만의 활동은 나 Lv 3에 열려요. 해버린 일은 지금도 추가할 수 있어요.');return}
    state.acts.push({id:'c'+Date.now().toString(36),name,fx:{[$('#newStat').value]:xp},bad:xp<0});
    save();keepScroll(render);showToast('활동을 추가했어요.')};
  const ar=$('#askReset');if(ar)ar.onclick=()=>{confirmReset=true;render()};
  const cr=$('#cancelReset');if(cr)cr.onclick=()=>{confirmReset=false;render()};
  const dr=$('#doReset');if(dr)dr.onclick=()=>{confirmReset=false;onboard=newOnboard(false);state=null;lsSet(null);
    if(ref)ref.set({v:4,reset:true}).catch(()=>{});render();window.scrollTo(0,0)};
  const rd=$('#rediag');if(rd)rd.onclick=()=>{onboard=newOnboard(true);render();window.scrollTo(0,0)};
  bindStudy();bindBackup();bindProgress();
  const vb=$('[data-ver]');if(vb)vb.onclick=devTapVersion;
}
function bindProgress(){
  document.querySelectorAll('[data-gotab]').forEach(b=>b.onclick=()=>{tab=b.dataset.gotab;render();window.scrollTo(0,0)});
  document.querySelectorAll('[data-title]').forEach(b=>b.onclick=()=>showTitlePicker(curP));
  document.querySelectorAll('[data-ach]').forEach(b=>b.onclick=()=>showAchInfo(ACH.find(a=>a.id===b.dataset.ach),curP));
  document.querySelectorAll('[data-reroll]').forEach(b=>b.onclick=()=>{
    const t=todayStr(),q=state.quests.d[t];if(!q)return;const i=+b.dataset.reroll;const n=q.rr===true?1:(q.rr||0);
    if(n>0&&seedsOf(curP)<REROLL_COST){showToast(`씨앗이 ${REROLL_COST}개 필요해요.`);return}
    const R=replay(state);const nw=pickDaily(t,R.cur,q.ids,1,'rr'+i+'-'+n)[0];if(!nw){showToast('바꿀 수 있는 퀘스트가 없어요.');return}
    if(n>0)buy({id:'reroll',cost:REROLL_COST});
    const ids=q.ids.slice();ids[i]=nw;state.quests.d[t]={ids,rr:n+1};save();keepScroll(render);showToast(n>0?`씨앗 ${REROLL_COST}개로 퀘스트를 바꿨어요.`:'퀘스트를 바꿨어요.')});
  document.querySelectorAll('[data-skin]').forEach(b=>b.onclick=()=>{state.skin=b.dataset.skin;save();keepScroll(render)});
  document.querySelectorAll('[data-pot]').forEach(b=>b.onclick=()=>{state.pot=b.dataset.pot;save();keepScroll(render)});
  bindGarden();
}
function keepScroll(fn){const y=window.scrollY;fn();window.scrollTo(0,y)}
function bindStudy(){
  document.querySelectorAll('[data-sid]').forEach(b=>b.onclick=()=>commit(()=>{
    const id=b.dataset.sid,k=b.dataset.sa;const day=Object.assign({},state.slogs[viewDay]);const l=day[id]||[];
    const s=state.studies.find(z=>z.id===id),isT=(sAct(s,k)||[])[3]==='time';
    day[id]=l.includes(k)?l.filter(x=>x!==k):[...l.filter(x=>!isT||(sAct(s,x)||[])[3]!=='time'),k];if(!day[id].length)delete day[id];
    if(Object.keys(day).length)state.slogs[viewDay]=day;else delete state.slogs[viewDay];
  }));
  document.querySelectorAll('[data-addstudy]').forEach(b=>b.onclick=()=>{sform=newSForm();tab='stats';render();const f=$('#sform');if(f)f.scrollIntoView({block:'start'})});
  if(sform&&$('#sform')){
    $('#sfName').addEventListener('input',e=>{sform.name=e.target.value;$('#sfAdd').disabled=!sformDone()});
    $('#sfGoal').addEventListener('input',e=>sform.goal=e.target.value);
    $('#sfDate').addEventListener('change',e=>sform.date=e.target.value);
    document.querySelectorAll('[data-stype]').forEach(b=>b.onclick=()=>{sform.type=b.dataset.stype;sform.ans=[];keepScroll(render)});
    document.querySelectorAll('[data-sq]').forEach(b=>b.onclick=()=>{
      sform.ans[+b.dataset.sq]=+b.dataset.o;
      b.parentNode.querySelectorAll('.opt').forEach(x=>{const on=x===b;x.classList.toggle('on',on);x.setAttribute('aria-pressed',on)});
      const t=STYPES[sform.type],pv=$('#sfPreview'),acts=pv.dataset.acts;
      pv.innerHTML=(t.qs.every((q,i)=>sform.ans[i]!=null)?`시작 레벨 <b class="num">Lv ${sformBase()}</b>. `:'질문에 답하면 시작 레벨이 정해져요. ')+esc(acts);
      $('#sfAdd').disabled=!sformDone();
    });
    $('#sfCancel').onclick=()=>{sform=null;keepScroll(render)};
    $('#sfAdd').onclick=()=>{
      if(!sformDone())return;
      const s={id:'s'+Date.now().toString(36),name:sform.name.trim(),type:sform.type,goal:sform.goal.trim(),date:sform.date||'',base:sformBase(),start:todayStr(),pauses:[],archived:false};
      state.studies.push(s);sform=null;save();keepScroll(render);showToast(`${s.name} 공부를 Lv ${s.base}에서 시작해요.`);
    };
  }
  document.querySelectorAll('[data-sarch]').forEach(b=>b.onclick=()=>{const s=state.studies.find(z=>z.id===b.dataset.sarch);s.archived=true;s.pauses=[...(s.pauses||[]),[todayStr(),null]];save();keepScroll(render)});
  document.querySelectorAll('[data-srest]').forEach(b=>b.onclick=()=>{const s=state.studies.find(z=>z.id===b.dataset.srest);s.archived=false;const p=s.pauses[s.pauses.length-1];if(p&&p[1]==null)p[1]=todayStr();save();keepScroll(render)});
  document.querySelectorAll('[data-sdel]').forEach(b=>b.onclick=()=>{confirmDel=b.dataset.sdel;keepScroll(render)});
  document.querySelectorAll('[data-sdelno]').forEach(b=>b.onclick=()=>{confirmDel=null;keepScroll(render)});
  document.querySelectorAll('[data-sdelok]').forEach(b=>b.onclick=()=>{const id=b.dataset.sdelok;
    state.studies=state.studies.filter(s=>s.id!==id);
    for(const d in state.slogs){delete state.slogs[d][id];if(!Object.keys(state.slogs[d]).length)delete state.slogs[d]}
    confirmDel=null;save();keepScroll(render)});
  document.querySelectorAll('[data-gostats]').forEach(b=>b.onclick=()=>{tab='stats';const R=replay(state);SUBS.forEach(s=>{if(R.cur[s.k].wait)openCats.add(s.cat)});render();window.scrollTo(0,0)});
  document.querySelectorAll('[data-meas]').forEach(b=>b.onclick=()=>{measOpen=measOpen===b.dataset.meas?null:b.dataset.meas;keepScroll(render);const i=$('#measIn');if(i)i.focus({preventScroll:true})});
  const mc=$('#measCancel');if(mc)mc.onclick=()=>{measOpen=null;keepScroll(render)};
  const ms=$('#measSave');if(ms)ms.onclick=()=>{
    const k=ms.dataset.k,raw=$('#measIn').value.trim(),v=Number(raw);
    if(raw===''||!isFinite(v)||v<0){showToast('측정값을 숫자로 적어 주세요.');return}
    const B=replay(state);const c=SUB[k]?B.cur[k]:B.scur[k];const G=nextGate(c);const cr=critOf(k);
    const name=SUB[k]?SUB[k].n:(state.studies.find(z=>z.id===k)||{}).name;
    state.tests=[...(state.tests||[]),{k,date:todayStr(),v,gates:gatesFor(k,v)}];measOpen=null;
    const A=replay(state);const a=SUB[k]?A.cur[k]:A.scur[k];
    save();keepScroll(render);
    if(a.lvl>c.lvl)showToast(`<b>승급!</b> ${esc(name)} Lv ${a.lvl}`,true);
    else if(v>=cr.t[G/10-1])showToast(`Lv ${G} 승급 시험 통과! 경험치가 차면 바로 올라가요.`);
    else showToast(`기록했어요. Lv ${G}까지 ${+(cr.t[G/10-1]-v).toFixed(2)}${cr.u} 더 필요해요.`);
  };
  document.querySelectorAll('[data-crit]').forEach(i=>i.addEventListener('change',()=>{
    const k=i.dataset.crit,nums=i.value.split(/[,\s]+/).filter(Boolean).map(Number);
    if(nums.length!==10||nums.some(n=>!isFinite(n)||n<0)){showToast('숫자 10개를 쉼표로 나눠 적어 주세요.');i.value=critOf(k).t.join(', ');return}
    state.crit=Object.assign({},state.crit,{[k]:nums});save();showToast('승급 기준을 바꿨어요.')}));
  const cr0=$('#critReset');if(cr0)cr0.onclick=()=>{state.crit={};save();keepScroll(render);showToast('승급 기준을 기본값으로 되돌렸어요.')};
}
function commit(mutate){
  const B=replay(state),before=B.cur;
  mutate();
  const A=replay(state),after=A.cur;
  const ups=[],downs=[];
  state.studies.forEach(s=>{const b=B.scur[s.id],a=A.scur[s.id];if(!a||!b)return;if(a.lvl>b.lvl)ups.push(`${s.name} Lv ${a.lvl}`);if(a.lvl<b.lvl)downs.push(`${s.name} Lv ${a.lvl}`)});
  SUBS.forEach(s=>{const d=after[s.k].lvl-before[s.k].lvl;if(d>0)ups.push(`${s.n} Lv ${after[s.k].lvl}`);if(d<0)downs.push(`${s.n} Lv ${after[s.k].lvl}`)});
  const y=window.scrollY;save();render();window.scrollTo(0,y);
  if(ups.length)showToast(`<b>레벨 업!</b> ${ups.join(', ')}`,true);
  else if(downs.length)showToast(`<b>레벨 다운</b> ${downs.join(', ')}`,true);
}
let toastT;
function showToast(msg,html){const t=$('#toast');if(html)t.innerHTML=msg;else t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2400)}
document.querySelectorAll('nav.tabs button').forEach(b=>b.onclick=()=>{if(b.dataset.tab!==tab)qsub='quest';tab=b.dataset.tab;if(celebOpen&&!celebQ.length)closeModal();confirmReset=false;impPending=null;sform=null;confirmDel=null;measOpen=null;if(tab==='today')viewDay=todayStr();render();window.scrollTo(0,0)});

/* ---------- 시작 ---------- */
const RESET_ID='2026-10-14-reset1';   // 이 표시가 없는 예전 저장은 무시함 (초기화)
const APP_VERSION='0.13.1 베타 (10월 15일)';
const validShape=s=>!!(s&&s.base&&s.startDate&&Array.isArray(s.acts)&&s.logs);
const valid=s=>validShape(s)&&s.resetId===RESET_ID;
function adopt(s){const m=migrate(s);refreshActs(m);if(!m.quests)m.quests={d:{},w:{}};if(!m.cond)m.cond={};if(!m.studies)m.studies=[];if(!m.slogs)m.slogs={};if(!m.tests)m.tests=[];if(!m.crit)m.crit={};const changed=m!==s;state=m;return changed}
(async()=>{
  const local=lsGet();
  let embedded=null;try{const el=document.getElementById('savedata');if(el)embedded=JSON.parse(el.textContent)}catch(e){}
  const newer=(a,b)=>!valid(a)?b:!valid(b)?a:((b.savedAt||'')>(a.savedAt||'')?b:a);
  const first=newer(local,embedded);
  if(valid(first)){adopt(first);lsSet(state)}
  render();   // 저장소 연결을 기다리지 않고 바로 화면을 띄움
  try{
    db=window.claude?await window.claude.use('db'):null;
    const user=db&&window.claude?await window.claude.use('user'):null;
    const uid=user?await user.id():null;
    if(db&&uid){
      ref=db.doc(`data/users/${uid}/game`);
      const snap=await ref.get();
      const remote=snap.exists?snap.data():null;
      const busy=onboard&&(onboard.step>0||onboard.keep);
      const remoteNewer=valid(remote)&&(!valid(state)||(remote.savedAt||'')>=(state.savedAt||''));
      if(remoteNewer&&!busy){const changed=adopt(remote);onboard=null;lsSet(state);render();if(changed)flush()}
      else if(valid(state)){flush()}
      if(tab==='set'&&!onboard)render();
    }
  }catch(e){ref=null}
})();
window.__raiseMe={replay:()=>state&&replay(state),migrate};
})();
</script>

if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})})}
